    const { useState, useEffect, useCallback } = React;

    // --- Audio Feedback Synthesizer ---
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) audioCtx = new AudioContext();
      }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playPresentSound() {
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.12, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.13);
      } catch (e) {}
    }

    function playAbsentSound() {
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(330, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(220, ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.14, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.13);
      } catch (e) {}
    }

    function playCompletionSound() {
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          const startTime = ctx.currentTime + idx * 0.09;
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, startTime);
          gain.gain.setValueAtTime(0.15, startTime);
          gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.25);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(startTime);
          osc.stop(startTime + 0.26);
        });
      } catch (e) {}
    }

    const STORAGE_KEY = 'rollcall_classes_v1';
    const PREFIX = 'rollcall_records_';

    function getClasses() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(defaultClasses));
        return defaultClasses;
      }
      try {
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) && parsed.length > 0 ? parsed : defaultClasses;
      } catch (e) {
        return defaultClasses;
      }
    }

    function saveClasses(classes) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(classes));
    }

    function getClassRecords(classId) {
      const raw = localStorage.getItem(PREFIX + classId);
      return raw ? JSON.parse(raw) : {};
    }

    function saveClassSession(classId, session) {
      const records = getClassRecords(classId);
      records[session.date] = { ...session, updatedAt: Date.now() };
      localStorage.setItem(PREFIX + classId, JSON.stringify(records));
    }

    function exportToCSV(selectedClass, dateString, session) {
      const headers = ["Roll Number", "Student Name", "Gender", "Date", "Status"];
      const rows = selectedClass.students.map(student => {
        const status = session.records[student.rollNo] || "unmarked";
        return [student.rollNo, `"${(student.name || '').replace(/"/g, '""')}"`, student.gender || 'Male', dateString, status.toUpperCase()];
      });
      const summaryRows = [
        [],
        ["Summary", "", "", ""],
        ["Total Students", session.summary.total, "", ""],
        ["Present", session.summary.present, "", ""],
        ["Absent", session.summary.absent, "", ""],
        ["Attendance Rate", `${session.summary.percentage}%`, "", ""]
      ];
      const csv = "data:text/csv;charset=utf-8," + [headers.join(","), ...rows.map(e => e.join(",")), ...summaryRows.map(e => e.join(","))].join("\n");
      const link = document.createElement("a");
      link.setAttribute("href", encodeURI(csv));
      link.setAttribute("download", `Attendance_${selectedClass.name.replace(/\s+/g, '_')}_${dateString}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // --- Main App Component ---
    function App() {
      const todayStr = new Date().toISOString().split('T')[0];
      const [classes, setClasses] = useState(getClasses);
      const [selectedClass, setSelectedClass] = useState(null);
      const [selectedDate, setSelectedDate] = useState(todayStr);
      const [currentView, setCurrentView] = useState('select-class');
      const [currentRecords, setCurrentRecords] = useState({});
      const [soundEnabled, setSoundEnabled] = useState(true);
      const [isAddModalOpen, setIsAddModalOpen] = useState(false);
      const [editingClass, setEditingClass] = useState(null);
      const [toastMessage, setToastMessage] = useState(null);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3000);
      };

      const handleSelectClassToTake = (cls) => {
        setSelectedClass(cls);
        const recordsMap = getClassRecords(cls.id);
        const existing = recordsMap[selectedDate];
        setCurrentRecords(existing && existing.records ? existing.records : {});
        setCurrentView('take-attendance');
      };

      const handleFinishAttendance = (records) => {
        setCurrentRecords(records);
        if (selectedClass) {
          const students = selectedClass.students || [];
          const presentCount = Object.values(records).filter(v => v === 'present').length;
          const absentCount = Object.values(records).filter(v => v === 'absent').length;
          const total = students.length;
          const percentage = total > 0 ? Math.round((presentCount / total) * 100) : 0;
          const session = {
            date: selectedDate,
            records,
            summary: { total, present: presentCount, absent: absentCount, percentage }
          };
          saveClassSession(selectedClass.id, session);
          showToast("Attendance logged to Local Storage!");
        }
        setCurrentView('summary');
      };

      const handleSaveAndExit = () => {
        if (selectedClass) {
          const students = selectedClass.students || [];
          const presentCount = Object.values(currentRecords).filter(v => v === 'present').length;
          const absentCount = Object.values(currentRecords).filter(v => v === 'absent').length;
          const total = students.length;
          const percentage = total > 0 ? Math.round((presentCount / total) * 100) : 0;
          const session = {
            date: selectedDate,
            records: currentRecords,
            summary: { total, present: presentCount, absent: absentCount, percentage }
          };
          saveClassSession(selectedClass.id, session);
          showToast("Saved successfully!");
        }
        setCurrentView('select-class');
      };

      const handleSaveClass = (classData) => {
        const index = classes.findIndex(c => c.id === classData.id);
        let updated;
        if (index >= 0) {
          updated = [...classes];
          updated[index] = classData;
        } else {
          updated = [...classes, classData];
        }
        setClasses(updated);
        saveClasses(updated);
        if (selectedClass && selectedClass.id === classData.id) setSelectedClass(classData);
        setIsAddModalOpen(false);
        setEditingClass(null);
        showToast(`Saved class "${classData.name}"!`);
      };

      const handleDeleteClass = (id) => {
        const filtered = classes.filter(c => c.id !== id);
        setClasses(filtered);
        saveClasses(filtered);
        localStorage.removeItem(PREFIX + id);
        showToast("Class deleted");
      };

      return (
        <div className="min-h-screen bg-slate-50 flex flex-col font-sans">
          {toastMessage && (
            <div className="fixed bottom-6 right-6 z-50 bg-slate-900 text-white px-4 py-2.5 rounded-xl shadow-xl text-xs font-semibold flex items-center gap-2">
              <span>✨</span>
              <span>{toastMessage}</span>
            </div>
          )}

          <header className="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
            <div className="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
              <div className="flex items-center space-x-3">
                {currentView !== 'select-class' && (
                  <button
                    onClick={() => setCurrentView('select-class')}
                    className="p-2 rounded-lg text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition-colors flex items-center gap-1 text-sm font-semibold"
                  >
                    ← <span className="hidden sm:inline">Classes</span>
                  </button>
                )}
                <div className="flex items-center space-x-2">
                  <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-600 flex items-center justify-center text-white shadow-sm font-bold text-base">
                    📋
                  </div>
                  <div>
                    <h1 className="text-base sm:text-lg font-bold text-slate-900 leading-tight flex items-center gap-2">
                      RollCall Pro
                      <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-600 border border-indigo-200">
                        Gender-Analytics
                      </span>
                    </h1>
                    <p className="text-xs text-slate-500">
                      {selectedClass ? `${selectedClass.name} • ${selectedDate}` : 'One-Tap Fast Attendance'}
                    </p>
                  </div>
                </div>
              </div>

              <div className="flex items-center space-x-2">
                {currentView === 'select-class' && (

                    onClick={() => { setEditingClass(null); setIsAddModalOpen(true); }}

                    + New Class
                  </button>

                  setSelectedClass(cls);
                  setCurrentRecords(session ? session.records : {});
                  setCurrentView('summary');

                onEditClass={(cls) => { setEditingClass(cls); setIsAddModalOpen(true); }}

                selectedDate={selectedDate}
                records={currentRecords}
                onUpdateRecords={setCurrentRecords}
                onSaveAndExit={handleSaveAndExit}
                onResumeTaking={() => setCurrentView('take-attendance')}
                onRetake={() => {
                  setCurrentRecords({});
                  setCurrentView('take-attendance');
                }}

            )}
          </main>

          {isAddModalOpen && (
            <AddClassModalView
              editingClass={editingClass}
              onClose={() => { setIsAddModalOpen(false); setEditingClass(null); }}
              onSaveClass={handleSaveClass}
            />

          <footer className="text-center text-xs text-slate-400 py-4 border-t border-slate-200">
            RollCall Attendance App • Gender Wise Analytics • Stored in Browser LocalStorage
          </footer>
        </div>
      );
    }

    // --- Sub-View: Class Selector ---
    function ClassSelectorView({ classes, selectedDate, onDateChange, onSelectToTake, onSelectToView, onOpenAdd, onEditClass, onDeleteClass }) {
      const [search, setSearch] = useState('');

            })}

            <button

      );
    }

    // --- Sub-View: One-by-One Attendance Taker with Gender & Name ---
    function AttendanceTakerView({ selectedClass, selectedDate, initialRecords, onFinishAttendance, soundEnabled }) {
      const students = selectedClass.students || [];
      const totalStudents = students.length;

      const [currentIndex, setCurrentIndex] = useState(() => {
        for (let i = 0; i < totalStudents; i++) {
          if (!initialRecords[students[i].rollNo]) return i;
        }
        return 0;
      });

      const [records, setRecords] = useState({ ...initialRecords });
      const currentStudent = students[currentIndex] || { rollNo: currentIndex + 1 };
      const currentStatus = records[currentStudent.rollNo];
      const isM = (currentStudent.gender || 'Male').toLowerCase() === 'male';

      const presentCount = Object.values(records).filter(s => s === 'present').length;
      const absentCount = Object.values(records).filter(s => s === 'absent').length;
      const markedCount = presentCount + absentCount;
      const progressPercent = totalStudents > 0 ? Math.round((markedCount / totalStudents) * 100) : 0;

      const boys = students.filter(s => (s.gender || 'Male').toLowerCase() === 'male');
      const girls = students.filter(s => (s.gender || '').toLowerCase() === 'female');
      const presentBoys = boys.filter(s => records[s.rollNo] === 'present').length;
      const presentGirls = girls.filter(s => records[s.rollNo] === 'present').length;

      const handleMark = useCallback((status) => {
        if (!currentStudent) return;
        if (soundEnabled) {
          if (status === 'present') playPresentSound();
          else playAbsentSound();
        }

        const updated = { ...records, [currentStudent.rollNo]: status };
        setRecords(updated);

        if (currentIndex >= totalStudents - 1) {
          if (soundEnabled) playCompletionSound();
          onFinishAttendance(updated);
        } else {
          setCurrentIndex(prev => prev + 1);
        }
      }, [currentStudent, records, currentIndex, totalStudents, soundEnabled, onFinishAttendance]);

      const handlePrevious = useCallback(() => {
        if (currentIndex > 0) setCurrentIndex(prev => prev - 1);
      }, [currentIndex]);

      const handleNext = useCallback(() => {
        if (currentIndex < totalStudents - 1) setCurrentIndex(prev => prev + 1);
      }, [currentIndex, totalStudents]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
          if (e.key === 'p' || e.key === 'P' || e.key === 'ArrowRight' || e.key === 'Enter') {
            e.preventDefault();
            handleMark('present');
          } else if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') {
            e.preventDefault();
            handleMark('absent');
          } else if (e.key === 'Backspace' || e.key === 'b' || e.key === 'B' || e.key === 'ArrowUp') {
            e.preventDefault();
            handlePrevious();
          } else if (e.key === ' ' || e.key === 'ArrowDown') {
            e.preventDefault();
            handleNext();
          }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [handleMark, handlePrevious, handleNext]);

      return (
        <div className="max-w-2xl mx-auto px-4 py-6 space-y-6">

              </div>

              <div className="flex items-center justify-between text-[11px] text-slate-500 font-medium pt-1">
                <span className="text-blue-700 bg-blue-50 px-2 py-0.5 rounded font-semibold">👦 Boys: {presentBoys}/{boys.length}</span>

          <div className="bg-white rounded-3xl p-8 sm:p-12 shadow-md border-2 border-slate-200 text-center relative overflow-hidden">
            <div className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">
              Student {currentIndex + 1} of {totalStudents}
            </div>

            <div className="space-y-2 mb-6">
              <span className="text-xs uppercase tracking-widest font-extrabold text-slate-400 block">Roll Number</span>
              <div className="text-6xl sm:text-7xl font-black text-slate-900 font-mono">
                {currentStudent.rollNo}
              </div>

              {/* Student Name & Gender Tag */}
              <div className="flex flex-wrap items-center justify-center gap-2 mt-2">

                <span className="text-xs text-slate-400 italic">Awaiting response...</span>

            {/* PRESENT & ABSENT BUTTONS */}
            <div className="grid grid-cols-2 gap-4 sm:gap-6 mt-8">
              <button
                onClick={() => handleMark('absent')}

    // --- Sub-View: Summary & Gender Breakdown ---

      const presentCount = presentStudents.length;
      const absentCount = absentStudents.length;
      const percentage = total > 0 ? Math.round((presentCount / total) * 100) : 0;

      // Gender stats
      const boys = students.filter(s => (s.gender || 'Male').toLowerCase() === 'male');
      const girls = students.filter(s => (s.gender || '').toLowerCase() === 'female');
      const boysPresent = boys.filter(s => records[s.rollNo] === 'present');
      const girlsPresent = girls.filter(s => records[s.rollNo] === 'present');
      const boysPct = boys.length > 0 ? Math.round((boysPresent.length / boys.length) * 100) : 0;
      const girlsPct = girls.length > 0 ? Math.round((girlsPresent.length / girls.length) * 100) : 0;

      const toggleStatus = (rollNo) => {
        onUpdateRecords({
          ...records,
          [rollNo]: records[rollNo] === 'present' ? 'absent' : 'present'

      };

      const copyNotice = () => {
        const absentList = absentStudents.length > 0 
          ? absentStudents.map(s => {
              const isM = (s.gender || 'Male').toLowerCase() === 'male';
              return `#${s.rollNo} ${s.name || `Student ${s.rollNo}`} (${isM ? 'Boy' : 'Girl'})`;
            }).join('\n   • ')

        const text = `📋 *ATTENDANCE REPORT*\n` +

    // --- Sub-View: Add / Edit Class Modal with Names & Gender Selection ---
    function AddClassModalView({ onClose, onSaveClass, editingClass }) {
      const [className, setClassName] = useState(editingClass ? editingClass.name : '');
      const [subject, setSubject] = useState(editingClass ? (editingClass.subject || '') : '');
      const [students, setStudents] = useState(() => {
        if (editingClass && editingClass.students) {
          return JSON.parse(JSON.stringify(editingClass.students));
        }
        return [
          { rollNo: 1, name: '', gender: 'Male' },
          { rollNo: 2, name: '', gender: 'Female' },
          { rollNo: 3, name: '', gender: 'Male' },
          { rollNo: 4, name: '', gender: 'Female' },
          { rollNo: 5, name: '', gender: 'Male' }
        ];
      });

      const handleAddRow = () => {
        const nextRoll = students.length > 0 ? Math.max(...students.map(s => Number(s.rollNo) || 0)) + 1 : 1;
        setStudents([...students, { rollNo: nextRoll, name: '', gender: 'Male' }]);
      };

      const handleUpdate = (idx, field, val) => {
        const updated = [...students];
        updated[idx][field] = val;
        setStudents(updated);
      };

      const handleRemove = (idx) => {
        setStudents(students.filter((_, i) => i !== idx));
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!className.trim()) return alert("Enter class name");

        const valid = students.map((s, idx) => ({
          rollNo: Number(s.rollNo) || (idx + 1),
          name: s.name.trim() || `Student ${s.rollNo || idx + 1}`,
          gender: s.gender || 'Male'
        }));

        if (valid.length === 0) return alert("Add at least one student");

        onSaveClass({
          id: editingClass ? editingClass.id : `class-${Date.now()}`,
          name: className.trim(),
          subject: subject.trim(),
          students: valid
        });
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-3 bg-slate-900/60 backdrop-blur-xs overflow-y-auto">
          <div className="bg-white rounded-3xl max-w-xl w-full p-6 shadow-2xl space-y-4 my-8 max-h-[90vh] flex flex-col">
            <div className="flex justify-between items-center border-b pb-3">
              <div>
                <h3 className="font-extrabold text-slate-900 text-lg">
                  {editingClass ? 'Edit Class & Student Roster' : 'Add Class & Students'}
                </h3>
                <p className="text-xs text-slate-500">Add student names and choose gender (Boy / Girl)</p>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-700 text-lg">✕</button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4 overflow-y-auto flex-1 pr-1">
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Class Name *</label>
                  <input
                    type="text"
                    required
                    placeholder="e.g. Class 10 - Section A"
                    value={className}
                    onChange={(e) => setClassName(e.target.value)}
                    className="w-full px-3 py-2 text-sm bg-slate-50 border rounded-xl font-semibold"
                  />
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Subject (Optional)</label>
                  <input
                    type="text"
                    placeholder="e.g. Science"
                    value={subject}
                    onChange={(e) => setSubject(e.target.value)}
                    className="w-full px-3 py-2 text-sm bg-slate-50 border rounded-xl"
                  />
                </div>
              </div>

              {/* Student Rows */}
              <div className="space-y-2 pt-2">
                <div className="flex justify-between items-center text-xs font-bold text-slate-700 bg-slate-50 p-2.5 rounded-xl border">
                  <span>Student Names & Genders ({students.length})</span>
                  <button
                    type="button"
                    onClick={handleAddRow}
                    className="px-2.5 py-1 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 font-bold"
                  >
                    + Add Student
                  </button>
                </div>

                <div className="space-y-2 max-h-60 overflow-y-auto pr-1">
                  {students.map((s, idx) => (
                    <div key={idx} className="flex items-center gap-2 p-1.5 bg-white border rounded-xl">
                      <span className="text-xs font-mono font-bold text-slate-400 pl-2">#{s.rollNo}</span>
                      <input
                        type="text"
                        placeholder="Student Name..."
                        value={s.name}
                        onChange={(e) => handleUpdate(idx, 'name', e.target.value)}
                        className="flex-1 px-2.5 py-1 text-xs font-semibold bg-slate-50 border rounded-lg"
                      />
                      <div className="flex bg-slate-100 p-0.5 rounded-lg border text-xs">
                        <button
                          type="button"
                          onClick={() => handleUpdate(idx, 'gender', 'Male')}
                          className={`px-2 py-0.5 rounded font-bold ${s.gender === 'Male' ? 'bg-blue-600 text-white' : 'text-slate-600'}`}
                        >
                          👦 Boy
                        </button>
                        <button
                          type="button"
                          onClick={() => handleUpdate(idx, 'gender', 'Female')}
                          className={`px-2 py-0.5 rounded font-bold ${s.gender === 'Female' ? 'bg-pink-600 text-white' : 'text-slate-600'}`}
                        >
                          👧 Girl
                        </button>
                      </div>
                      <button
                        type="button"
                        onClick={() => handleRemove(idx)}
                        className="text-slate-300 hover:text-red-500 px-1 text-sm"
                      >
                        ✕
                      </button>
                    </div>
                  ))}
                </div>
              </div>

              <div className="flex justify-between items-center pt-3 border-t">
                <button
                  type="button"
                  onClick={handleAddRow}
                  className="text-xs font-bold text-indigo-600 hover:text-indigo-800"
                >
                  + Add Another Row
                </button>
                <div className="flex gap-2">
                  <button type="button" onClick={onClose} className="px-4 py-2 text-xs font-bold text-slate-600">Cancel</button>
                  <button type="submit" className="px-5 py-2 text-xs font-bold text-white bg-indigo-600 rounded-xl hover:bg-indigo-700">
                    {editingClass ? 'Update Class' : 'Save Class'}
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
